name: Annonces et articles

# Toutes les heures à :30 : envoie les annonces dues (notification, e-mail) et publie les nouveaux
# articles du dossier Drive « CKMoney – Articles à publier » (agent Articles).
# Sans effet s'il n'y a rien à envoyer ; chaque annonce ne part qu'une fois (voir api/_lib/annonces.ts).
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : classer les articles du dossier sans rien publier ni envoyer"
        type: boolean
        default: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Annonces
        if: ${{ !inputs.essai }}
        run: curl -fsS -X POST https://ck-money.vercel.app/api/annonces
        continue-on-error: true
      - name: Articles du dossier Drive
        run: curl -fsS --max-time 70 -X POST "https://ck-money.vercel.app/api/articles-sync${{ inputs.essai && '?dry=1' || '' }}"
