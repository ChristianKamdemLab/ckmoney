
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKMoney - Contrats de Prêt Amicaux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Charte CKLabs : encre indigo #1C2551, ocre #C98A1E, filets #D9D2C3, gris #6B6F80.
      // Les nuances « indigo » et « amber » de Tailwind sont redirigées vers la charte.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              indigo: { 50:'#EEF0F6', 100:'#DDE1EE', 200:'#BCC3DC', 300:'#AAB1CF', 400:'#5D6798', 500:'#3A4370', 600:'#1C2551', 700:'#161D42', 800:'#111733', 900:'#0C1024' },
              amber: { 50:'#FBF5EA', 100:'#F6EBD6', 200:'#EDD5AC', 300:'#E2BC7C', 400:'#D6A24C', 500:'#C98A1E', 600:'#A97318', 700:'#865B13', 800:'#64440E', 900:'#432E09' },
              slate: { 50:'#F8F7F3', 100:'#F1EFE9', 200:'#E4E0D6', 300:'#D9D2C3', 400:'#9A9CA8', 500:'#6B6F80', 600:'#4E5266', 700:'#3A3E52', 800:'#262A3D', 900:'#1C2551' },
              ink: '#1C2551', ochre: '#C98A1E', rule: '#D9D2C3', mute: '#6B6F80', soft: '#EEF0F6', 'ochre-light': '#F6EBD6'
            },
            fontFamily: {
              sans: ['Figtree', 'system-ui', 'sans-serif'],
              serif: ['"Source Serif 4"', 'Georgia', 'serif']
            }
          }
        }
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..800;1,8..60,400..700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Figtree', system-ui, sans-serif;
            background-color: #F8F7F3;
            color: #22263A;
            -webkit-font-smoothing: antialiased;
        }
        .serif {
            font-family: 'Source Serif 4', Georgia, serif;
        }
        
        /* Optimisations pour l'impression PDF */
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background-color: white !important;
                margin: 0 !important;
                padding: 0 !important;
                color: black !important;
            }
            /* Assurer que les images et les couleurs s'impriment */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }
            /* On casse le positionnement fixe qui pose problème sur certains navigateurs pour le PDF */
            .fixed {
                position: absolute !important;
            }
            .overflow-y-auto {
                overflow: visible !important;
            }
            /* Supprimer les effets de flou et de transparence qui cassent le PDF */
            .backdrop-blur-2xl, .bg-slate-900\/90 {
                backdrop-filter: none !important;
                background-color: transparent !important;
            }
            #root {
                display: block !important;
            }
            @page {
                margin: 16mm 16mm 16mm 16mm;
                size: A4;
            }
            /* Éviter de couper les paragraphes entre deux pages */
            p, .page-break-avoid {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
