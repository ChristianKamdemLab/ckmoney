
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CKMoney — Prêts entre proches</title>
    <meta name="description" content="Vos prêts entre proches, avec des contrats en règle.">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1C2551">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CKMoney">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..800;1,8..60,400..700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Figtree', system-ui, sans-serif;
            background-color: #F8F7F3;
            color: #22263A;
            -webkit-font-smoothing: antialiased;
        }
        .serif {
            font-family: 'Source Serif 4', Georgia, serif;
        }
        @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
        
        /* Optimisations pour l'impression PDF */
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background-color: white !important;
                margin: 0 !important;
                padding: 0 !important;
                color: black !important;
            }
            /* Assurer que les images et les couleurs s'impriment */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }
            /* On casse le positionnement fixe qui pose problème sur certains navigateurs pour le PDF */
            .fixed {
                position: absolute !important;
            }
            .overflow-y-auto {
                overflow: visible !important;
            }
            /* Supprimer les effets de flou et de transparence qui cassent le PDF */
            .backdrop-blur-2xl, .bg-slate-900\/90 {
                backdrop-filter: none !important;
                background-color: transparent !important;
            }
            #root {
                display: block !important;
            }
            @page {
                margin: 16mm 16mm 16mm 16mm;
                size: A4;
            }
            /* Éviter de couper les paragraphes entre deux pages */
            p, .page-break-avoid {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
